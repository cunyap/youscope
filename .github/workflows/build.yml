name: YouScope CI

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  nightly:
    name: Build YouScope
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Save JDK 21 location
        shell: pwsh
        run: '"JDK21_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Set up default JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: gradle

      - name: Configure Gradle Java toolchains
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.gradle" | Out-Null
          $jdk8 = $env:JAVA_HOME -replace '\\', '/'
          $jdk21 = $env:JDK21_HOME -replace '\\', '/'
          "org.gradle.java.installations.paths=$jdk8,$jdk21" |
            Out-File -FilePath "$env:USERPROFILE\.gradle\gradle.properties" -Encoding ascii -Append

      - name: Verify Java environments
        shell: pwsh
        run: |
          java -version
          ./gradlew --version
          & "$env:JDK21_HOME\bin\java.exe" -version
          & "$env:JDK21_HOME\bin\javac.exe" -version

      - name: Prepare bundled JDK 21 runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $PWD "runtime"
          if (Test-Path $runtime) { Remove-Item $runtime -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Copy-Item -Path "$env:JDK21_HOME\*" -Destination $runtime -Recurse -Force
          if (-not (Test-Path "$runtime\bin\java.exe")) { throw "Bundled JDK 21 is incomplete" }

      - name: Build 64-bit installer
        shell: pwsh
        run: ./gradlew --no-daemon createInstaller

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "build\distributions\YouScope_64bit_Installer.exe"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          Get-Item $installer | Format-List FullName, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouScope_64bit_Installer
          path: build/distributions/YouScope_64bit_Installer.exe
          if-no-files-found: error

      - name: Create nightly release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly-${{ github.run_number }}
          release_name: Nightly Build ${{ github.run_number }}
          draft: false
          prerelease: true

      - name: Upload installer to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/distributions/YouScope_64bit_Installer.exe
          asset_name: YouScope_Installer_${{ github.run_number }}-64bit.exe
          asset_content_type: application/vnd.microsoft.portable-executable
