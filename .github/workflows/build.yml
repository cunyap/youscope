name: YouScope CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    name: Build YouScope
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # JDK 21: bundled as the YouScope runtime and used as a compile toolchain
      # for the plugins that need the GraalPy / Truffle 24.1 polyglot API
      # (graalpy, graaljs, cellpose, stardist).
      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Save JDK 21 location
        shell: pwsh
        run: '"JDK21_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      # JDK 8 is the JVM that runs Gradle (Gradle 7.6.4 supports running on
      # JDK 8-19 only). The main YouScope code compiles to 1.8; JDK 21 is
      # applied per-module as a toolchain in build.gradle for the polyglot
      # plugins.
      - name: Set up default JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: temurin
          cache: gradle

      - name: Configure Gradle Java toolchains
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.gradle" | Out-Null
          $jdk8 = $env:JAVA_HOME -replace '\\', '/'
          $jdk21 = $env:JDK21_HOME -replace '\\', '/'
          "org.gradle.java.installations.paths=$jdk8,$jdk21" |
            Out-File -FilePath "$env:USERPROFILE\.gradle\gradle.properties" -Encoding ascii -Append

      - name: Verify Java environments
        shell: pwsh
        run: |
          java -version
          ./gradlew --version
          & "$env:JDK21_HOME\bin\java.exe" -version
          & "$env:JDK21_HOME\bin\javac.exe" -version

      - name: Prepare bundled JDK 21 runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $PWD "runtime"
          if (Test-Path $runtime) { Remove-Item $runtime -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Copy-Item -Path "$env:JDK21_HOME\*" -Destination $runtime -Recurse -Force
          if (-not (Test-Path "$runtime\bin\java.exe")) { throw "Bundled JDK 21 is incomplete" }

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed ($LASTEXITCODE)" }

          # Locate makensis.exe (directly below NSIS or below NSIS\Bin
          # depending on the package version), same as the GitLab job.
          $item = Get-ChildItem 'C:\Program Files (x86)\NSIS','C:\Program Files\NSIS' `
                    -Filter makensis.exe -Recurse -File -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $item) { throw "makensis.exe not found after install" }

          $home_ = if ($item.Directory.Name -ieq 'Bin') { $item.Directory.Parent.FullName }
                   else { $item.Directory.FullName }

          "NSIS_HOME=$home_"          | Out-File -FilePath $env:GITHUB_ENV  -Encoding utf8 -Append
          "MAKENSIS=$($item.FullName)" | Out-File -FilePath $env:GITHUB_ENV  -Encoding utf8 -Append
          $item.Directory.FullName    | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "NSIS_HOME=$home_"
          Write-Host "MAKENSIS=$($item.FullName)"

      # The repo vendors the plugin DLLs as
      #   installer\nsis-plugins\x86-ansi\AccessControl.dll
      #   installer\nsis-plugins\x86-unicode\AccessControl.dll
      # (same as GitLab job).
      - name: Install NSIS plugins (AccessControl)
        shell: pwsh
        run: |
          $nsisAnsi    = Join-Path $env:NSIS_HOME "Plugins\x86-ansi"
          $nsisUnicode = Join-Path $env:NSIS_HOME "Plugins\x86-unicode"
          New-Item -ItemType Directory -Force -Path $nsisAnsi,$nsisUnicode | Out-Null

          $vendored = Join-Path $PWD "installer\nsis-plugins"
          $srcAnsi    = Join-Path $vendored "x86-ansi"
          $srcUnicode = Join-Path $vendored "x86-unicode"

          foreach ($pair in @(@($srcAnsi, $nsisAnsi), @($srcUnicode, $nsisUnicode))) {
            $src = $pair[0]; $dst = $pair[1]
            if (-not (Test-Path $src)) { throw "Missing vendored plugin folder: $src" }
            $dlls = Get-ChildItem $src -Filter *.dll -File
            if (-not $dlls) { throw "No DLLs in $src" }
            Copy-Item $dlls.FullName $dst -Force
          }

          foreach ($d in @($nsisAnsi, $nsisUnicode)) {
            if (-not (Test-Path (Join-Path $d "AccessControl.dll"))) {
              throw "AccessControl.dll missing in $d"
            }
          }

          Write-Host "ANSI plugins:";    Get-ChildItem $nsisAnsi    -Filter *.dll | Select-Object -ExpandProperty Name
          Write-Host "Unicode plugins:"; Get-ChildItem $nsisUnicode -Filter *.dll | Select-Object -ExpandProperty Name

      - name: Build 64-bit installer
        shell: pwsh
        run: |
          ./gradlew --no-daemon createInstaller
          if ($LASTEXITCODE -ne 0) { throw "Gradle installer build failed ($LASTEXITCODE)" }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "build\distributions\YouScope_64bit_Installer.exe"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          Get-Item $installer | Format-List FullName, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: YouScope_64bit_Installer
          path: build/distributions/YouScope_64bit_Installer.exe
          if-no-files-found: error

      # Creates the release and uploads
      # the asset in one step.
      - name: Create nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          name: Nightly Build ${{ github.run_number }}
          draft: false
          prerelease: true
          files: build/distributions/YouScope_64bit_Installer.exe