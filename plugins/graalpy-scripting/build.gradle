// plugins/graalpy-scripting/build.gradle

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// The root allprojects block sets sourceCompatibility = '1.7' on ALL
// compileJava tasks after our java{} block runs. We re-assert 17 here
// using doFirst so it runs last, overriding the root setting.
compileJava.doFirst {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

afterEvaluate {
    def jvm7 = 7
    configurations.apiElements.attributes {
        attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, jvm7)
    }
    configurations.runtimeElements.attributes {
        attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, jvm7)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    def graalvmVersion = '24.1.0'
    implementation "org.graalvm.polyglot:polyglot:${graalvmVersion}"
    implementation "org.graalvm.python:python-language:${graalvmVersion}"
    implementation "org.graalvm.python:python-resources:${graalvmVersion}"
    implementation "org.graalvm.truffle:truffle-api:${graalvmVersion}"
    implementation "org.graalvm.truffle:truffle-runtime:${graalvmVersion}"
    implementation "org.graalvm.truffle:truffle-nfi:${graalvmVersion}"
    implementation "org.graalvm.truffle:truffle-nfi-libffi:${graalvmVersion}"
    implementation "org.graalvm.sdk:nativeimage:${graalvmVersion}"
    implementation "org.graalvm.sdk:word:${graalvmVersion}"
    implementation "org.graalvm.sdk:collections:${graalvmVersion}"
    implementation "org.graalvm.regex:regex:${graalvmVersion}"
    implementation "com.ibm.icu:icu4j:74.2"
    // GraalJS (JavaScript / Nashorn replacement)
    implementation "org.graalvm.js:js:${graalvmVersion}"
    runtimeOnly "org.graalvm.js:js-scriptengine:${graalvmVersion}"
    implementation "org.graalvm.shadowed:icu4j:24.1.0"
    implementation "org.bouncycastle:bcprov-jdk18on:1.78.1"
    implementation "org.bouncycastle:bcpkix-jdk18on:1.78.1"
    implementation "org.bouncycastle:bcutil-jdk18on:1.78.1"
}

task copyGraalLibs(type: Copy) {
    dependsOn configurations.runtimeClasspath
    from configurations.runtimeClasspath.filter { f ->
        f.name.contains('polyglot')    ||
        f.name.contains('python')      ||
        f.name.contains('truffle')     ||
        f.name.contains('graal')       ||
        f.name.contains('icu4j')       ||
        f.name.contains('regex')       ||
        f.name.contains('collections') ||
        f.name.contains('nativeimage') ||
        f.name.startsWith('word-') ||
        f.name.contains('truffle-nfi') ||
        f.name.contains('bcprov') ||
        f.name.startsWith('icu4j-24') ||
        f.name.contains('bcpkix') ||
        f.name.contains('bcutil')
    }
    into "${rootProject.projectDir}/libs"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
build.dependsOn copyGraalLibs