// plugins/faster/build.gradle

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

compileJava.doFirst {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

afterEvaluate {
    def jvm7 = 7
    configurations.apiElements.attributes {
        attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, jvm7)
    }
    configurations.runtimeElements.attributes {
        attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, jvm7)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // FastER reuses the cell-detection backend (AnalysisBackendClient and the shared
    // Python server) for its geometry which does not require graalpy.
    implementation project(':plugins:cell-detection')
}
